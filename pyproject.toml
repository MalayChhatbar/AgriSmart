[project]
name = "agismart"
version = "2.1.0"
description = "AgriSmart AI — Intelligent Modular Agriculture Backend with ONNX, SQLite, OpenWeather, and NVIDIA NIM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "onnxruntime>=1.19.0",
    "opencv-python-headless>=4.10.0.84",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "pydantic>=2.8.0",
    "openai>=1.45.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "scikit-learn>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
