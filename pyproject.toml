[project]
name = "agrismart"
version = "2.1.0"
description = "AgriSmart AI — Crop Disease Detection (SIH 2026) — ONNX Runtime + Gradio + uv CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "onnxruntime>=1.19.0",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "huggingface_hub>=0.24.0",
    "gradio>=4.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
torch = ["torch>=2.4.0", "torchvision>=0.19.0", "timm>=0.9.7", "scikit-learn>=1.5.0"]

[project.scripts]
agrismart = "cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli", "gradio_app", "model"]

[tool.uv]
managed = true
